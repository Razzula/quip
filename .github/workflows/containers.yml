name: Build containers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build quippi
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/quippi/Containerfile
          push: true
          tags: ghcr.io/razzula/quippi:latest

      - name: Build thwip
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/thwip/Containerfile
          push: true
          tags: ghcr.io/razzula/thwip:latest
